# ---------------------------------------------------------------------------
# Two containers:
#   mlflow       the MLflow tracking server and model registry
#   rul-service  our prediction service (built from ./Dockerfile)
#
#   Start:      docker compose up -d --build    (-d = in the background;
#                                                --build = rebuild our image
#                                                if the code changed)
#   Status:     docker compose ps
#   Logs:       docker compose logs -f rul-service      (or: mlflow)
#   Stop:       docker compose down             (your experiment history is kept)
#   MLflow:     http://localhost:5000
#   Service:    http://127.0.0.1:8000/docs
#   Diary:      logs/predictions/  (every prediction the service makes)
#   Prometheus: http://127.0.0.1:9090  (the service's health numbers over time)
#   Grafana:    http://127.0.0.1:3000  (dashboards; user "admin", password in .env)

#
# Inside Docker, each container has its OWN "localhost". Compose puts both on a
# private network where each is reachable by its service NAME -- so the
# service finds MLflow at http://mlflow:5000, not http://localhost:5000.
#
# (Older tutorials call this file docker-compose.yml. compose.yaml is the
# current standard name; Docker accepts both.)
# ---------------------------------------------------------------------------

services:
  mlflow:
    # A ready-made "box" published by the MLflow project. The version is pinned
    # for the same reason as requirements.txt: the server must not change under
    # us, and it must match the MLflow client version in requirements.txt.
    image: ghcr.io/mlflow/mlflow:v3.17.1
    container_name: mlflow-server

    # The program to run inside the box.
    #   --host 0.0.0.0   accept connections coming from OUTSIDE the container
    #                    (the default would only listen to itself).
    #   --backend-store-uri   where run settings and scores go: a small SQLite
    #                    database file. Four slashes = the absolute path
    #                    /mlflow/mlflow.db inside the container.
    #   --artifacts-destination   where files go (saved models, etc.). The
    #                    server receives them over HTTP, so our project never
    #                    needs to touch this folder directly.
    #   --allowed-hosts  which names visitors may address the server by. By
    #                    default only localhost and private IP addresses: a
    #                    protection against "DNS rebinding" (tricking a browser
    #                    into reaching services on your machine). Our service
    #                    addresses it as mlflow:5000, which was refused with 403
    #                    -- while /health still said OK. Exactly one trusted
    #                    name is added; never "*". Setting this REPLACES the
    #                    defaults, so localhost and 127.0.0.1 are listed too.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:5000

    # "Windows port : container port". 127.0.0.1 means only THIS computer can
    # reach it. That matters: the MLflow server has no login, so it must not be
    # exposed to everyone else on your network.
    ports:
      - "127.0.0.1:5000:5000"

    # A container's own files vanish when the container is deleted. A VOLUME is
    # storage that Docker keeps separately, so the database and saved models
    # survive restarts, upgrades, and `docker compose down`.
    volumes:
      - mlflow_data:/mlflow

    # MLflow 3 sends anonymous usage statistics by default. Switched off: nothing
    # about this project needs to leave this machine. (Our scripts -- the client
    # side -- need the same setting in your environment; see the README.)
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"

    # "Are you ready?" -- every 10 s, ask the server's /health page. The
    # prediction service waits for "healthy" before starting (see below).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    # Start again automatically when Docker starts, unless you stopped it.
    restart: unless-stopped

  rul-service:
    # Our own image, built from ./Dockerfile (with ./.dockerignore deciding
    # what Docker may see).
    build: .
    image: rul-service:1.0.0
    container_name: rul-service

    # Where to find MLflow -- by its service name on the compose network. The
    # MLFLOW_TRACKING_URI setting wins over configs/training.yaml's localhost
    # address (see resolve_tracking_uri in src/models/tracking.py).
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    # Like MLflow: reachable only from this computer. The service has no login.
    ports:
      - "127.0.0.1:8000:8000"

    # The diary of predictions (configs/monitoring.yaml). "./logs:/app/logs"
    # is a BIND MOUNT: the container's /app/logs folder IS this project's
    # logs/ folder on Windows. Unlike MLflow's volume, which only Docker can
    # see into, these files can be opened in VS Code and read by our scripts.
    # logs/ is git-ignored and never copied into the image.
    volumes:
      - ./logs:/app/logs

    # The service fetches the champion at startup, so MLflow must be READY --
    # not merely started.
    depends_on:
      mlflow:
        condition: service_healthy

    restart: unless-stopped

  prometheus:
    # Collects the service's health numbers (its /metrics page) every few
    # seconds and keeps their history. Official image, pinned like MLflow.
    image: prom/prometheus:v3.15.1
    container_name: prometheus

    volumes:
      # Its settings: what to collect, how often. ":ro" = read-only -- the
      # container may read our file but never change it.
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The collected history, kept by Docker (like MLflow's data): survives
      # restarts and `docker compose down`. Prometheus keeps 15 days by default.
      - prometheus_data:/prometheus

    # Like the others: reachable only from this computer. Prometheus has no login.
    ports:
      - "127.0.0.1:9090:9090"

    # "Are you ready?" -- Prometheus's own health page, asked with wget (a
    # small download tool included in the image).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

    restart: unless-stopped

  grafana:
    # Dashboards on top of Prometheus. Stores no measurements itself: every
    # panel asks Prometheus a PromQL question. Official image, pinned.
    image: grafana/grafana:13.2.4
    container_name: grafana

    environment:
      # The admin login. The password comes from the local, git-ignored .env
      # file -- never written here, because this repository is public.
      # ":?" = refuse to start if it is missing, instead of an empty password.
      # NOTE: Grafana uses it only on its FIRST start, when it creates the
      # admin user in its storage; changing .env later does not change it.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the .env file}
      # Nothing leaves this machine (Grafana's defaults, from its defaults.ini):
      GF_ANALYTICS_REPORTING_ENABLED: "false"         # usage counters to stats.grafana.org
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"         # asking grafana.com for new versions
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"  # ... and new plugin versions
      GF_NEWS_NEWS_FEED_ENABLED: "false"              # news feed loaded from grafana.com
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"          # "publish snapshot" to an outside site

    volumes:
      # Our set-up files, read-only: the data source and the dashboard provider
      # (Grafana's provisioning folder, GF_PATHS_PROVISIONING in the image) ...
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # ... and the dashboards themselves (the path in dashboards.yml).
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      # Grafana's own storage (users, preferences), kept by Docker.
      - grafana_data:/var/lib/grafana

    # Like the others: reachable only from this computer.
    ports:
      - "127.0.0.1:3000:3000"

    # Its panels need Prometheus, so start once Prometheus is ready.
    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

    restart: unless-stopped

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
