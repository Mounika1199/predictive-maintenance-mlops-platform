# ---------------------------------------------------------------------------
# Which models to train, and their settings.
#
# Same idea as features.yaml: choices we may want to change live here, not
# buried inside code.
# ---------------------------------------------------------------------------

# Fixes the random choices the random forest makes while learning, so training
# twice on the same data gives exactly the same model.
random_state: 42

models:
  # Always predicts the training average. Not a real candidate -- it is the bar
  # every real model must clearly beat.
  baseline: {}

  # A weighted sum of the features. No settings needed.
  linear: {}

  random_forest:
    n_estimators: 200      # how many flowcharts (trees) to average
    min_samples_leaf: 5    # each final answer must rest on >= 5 training rows,
                           # which stops a tree memorising one odd row
    n_jobs: -1             # use every processor core (speed only)

# The winner is the model with the lowest RMSE on the VALIDATION engines.
# The test set is never used to choose -- see scripts/evaluate.py.
selection_metric: rmse

# Rules for scripts/promote_model.py, which moves the "champion" tag.
promotion:
  # A challenger must beat the champion's validation RMSE by at least this many
  # cycles. Anything smaller counts as a tie, and a tie is no reason to switch.
  # Without a margin, rounding dust could decide: the forest's predictions
  # wobble at the 14th decimal place, so a retrained copy of the champion could
  # "win" by 0.00000000000001.
  min_improvement_rmse: 0.1

# Where every training run is recorded. The MLflow server runs in Docker
# (see compose.yaml -- start it with `docker compose up -d`).
#
# If the standard MLFLOW_TRACKING_URI environment variable is set, it wins over
# tracking_uri below. That lets tests, or another machine, point somewhere else
# without editing this file.
mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: rul-fd001

  # The model's name in the MLflow MODEL REGISTRY -- the catalogue of numbered
  # versions. train.py adds each session's winner as a new version tagged
  # "challenger"; only scripts/promote_model.py moves the "champion" tag, which
  # marks the version in use. Anything that needs the model asks for
  # models:/rul-fd001@champion.
  registered_model_name: rul-fd001
