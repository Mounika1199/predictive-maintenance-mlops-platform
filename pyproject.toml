[tool.pytest.ini_options]
# Adds the repository root to Python's import path when running tests, so that
# `from src.data.load_cmapss import ...` works without sys.path hacks or having
# to pip-install the project. Keeps test files clean.
pythonpath = ["."]
testpaths = ["tests"]
# Evidently imports litestar (the web server of its optional dashboard, which
# we do not use), and litestar warns about its OWN internal code. Hidden for
# that package only: warnings from our code or any other library still show.
filterwarnings = ["ignore::DeprecationWarning:litestar"]
